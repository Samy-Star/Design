<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Challenge Figma 30 jours — Fêtes du monde</title>
<style>
:root{
  --bg:#f4f5fa; --surface:#ffffff; --surface-2:#f0f1f8; --text:#1b1d2a; --muted:#6a6f85;
  --border:#e4e6f0; --accent:#5b4bff; --accent-soft:#e9e6ff; --accent-text:#ffffff;
  --todo:#b6bace; --doing:#f5a524; --done:#1fb878;
  --shadow:0 1px 2px rgba(20,22,50,.05),0 8px 24px rgba(20,22,50,.07);
  --shadow-sm:0 1px 2px rgba(20,22,50,.06);
  --radius:16px; --sidebar-w:340px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1017; --surface:#171925; --surface-2:#1f2231; --text:#eceefa; --muted:#9a9fb8;
    --border:#2a2e42; --accent:#8b7dff; --accent-soft:#2a2650; --accent-text:#0f1017;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

/* Layout */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100vh;height:100dvh}
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.side-head{padding:20px 20px 14px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;background:none;border:0;padding:0;text-align:left;width:100%}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#5b4bff,#ff5fa2 60%,#ffb347);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:none}
.brand h1{font-size:16px;line-height:1.2;margin:0}
.brand small{color:var(--muted);font-size:12px}
.search{position:relative;margin-top:16px}
.search input{width:100%;padding:11px 12px 11px 38px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);outline:none}
.search input:focus{border-color:var(--accent);background:var(--surface)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:1px solid var(--border);background:var(--surface);padding:5px 11px;border-radius:999px;font-size:12.5px;color:var(--muted);transition:.15s}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.status-row{display:flex;gap:6px;margin-top:10px;align-items:center}
.status-row label{font-size:12px;color:var(--muted)}
.status-row select{flex:1;padding:6px 8px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);font-size:13px}
.list{overflow-y:auto;flex:1;padding:10px;min-height:0}
.list .count{font-size:12px;color:var(--muted);padding:4px 10px 8px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid transparent;background:none;padding:10px;border-radius:12px;transition:.12s}
.item:hover{background:var(--surface-2)}
.item.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.num{flex:none;width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--muted)}
.item.active .num{background:var(--accent);color:var(--accent-text)}
.item .txt{min-width:0;flex:1}
.item .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--todo)}
.dot.doing{background:var(--doing)}
.dot.done{background:var(--done);box-shadow:0 0 0 3px color-mix(in srgb,var(--done) 25%,transparent)}
.empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:14px}

/* Main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:16px;padding:14px 28px;background:var(--surface);border-bottom:1px solid var(--border)}
.menu-btn{display:none;border:1px solid var(--border);background:var(--surface-2);border-radius:10px;width:40px;height:40px;place-items:center;flex:none}
.menu-btn svg{width:20px;height:20px}
.prog{flex:1;min-width:0}
.prog-top{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin-bottom:7px;flex-wrap:wrap}
.prog-top strong{font-weight:700}
.prog-top span{color:var(--muted)}
.bar{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .4s ease}
.bar .b-done{background:linear-gradient(90deg,#5b4bff,#1fb878)}
.bar .b-doing{background:var(--doing);opacity:.85}
.reset{border:1px solid var(--border);background:none;border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--muted);flex:none}
.reset:hover{color:#d64545;border-color:#d64545}
.content{overflow-y:auto;flex:1;padding:28px;min-height:0}
.wrap{max-width:980px;margin:0 auto}

/* Home */
.hero{background:linear-gradient(135deg,#5b4bff 0%,#8a4bff 45%,#ff5fa2 100%);color:#fff;border-radius:24px;padding:32px;box-shadow:var(--shadow);margin-bottom:28px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero h2{margin:0 0 8px;font-size:28px;line-height:1.2;position:relative}
.hero p{margin:0 0 20px;max-width:620px;opacity:.95;position:relative}
.hero .cta{background:#fff;color:#4a3bd8;border:0;border-radius:12px;padding:11px 18px;font-weight:700;position:relative;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.week{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow-sm)}
.week b{display:block;font-size:13px}
.week span{font-size:12px;color:var(--muted)}
.week .wb{height:6px;background:var(--surface-2);border-radius:99px;margin-top:10px;overflow:hidden}
.week .wb i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:0;text-align:left;box-shadow:var(--shadow-sm);overflow:hidden;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.strip{height:8px;display:flex}
.strip i{flex:1}
.card-b{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .d{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.card h3{margin:0;font-size:16px;line-height:1.3}
.card p{margin:0;font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);margin-top:auto;align-self:flex-start}
.card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}

/* Detail */
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.crumbs button{background:none;border:0;padding:0;color:var(--accent);font-weight:600}
.head{background:var(--surface);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
.head .strip{height:10px}
.head-b{padding:26px 28px}
.eyebrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pill{font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.alt{background:var(--surface-2);color:var(--muted);font-weight:600}
.head h2{margin:0;font-size:28px;line-height:1.2}
.head .sub{margin:6px 0 0;font-size:16px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px}
.btn{border:1px solid var(--border);background:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;display:inline-flex;gap:8px;align-items:center;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-text)}
.btn svg{width:17px;height:17px}
.check{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);font-weight:600;font-size:14px;cursor:pointer;user-select:none}
.check input{width:20px;height:20px;accent-color:var(--done);cursor:pointer;margin:0}
.check.on{background:color-mix(in srgb,var(--done) 14%,var(--surface));border-color:var(--done);color:var(--done)}
.sel{padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:14px}
.sections{display:grid;gap:14px}
.sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow-sm)}
.sec h3{margin:0 0 8px;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec h3 span.i{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--accent-soft);font-size:13px;letter-spacing:0}
.sec p{margin:0;font-size:15.5px}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.sw button{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.sw button:hover{border-color:var(--accent)}
.sw i{width:26px;height:26px;border-radius:50%;border:1px solid rgba(128,128,128,.35);display:block}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:#1b1d2a;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}

/* ---------- Design du Jour (publication) ---------- */
.design{padding:0;overflow:hidden}
.design .d-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 22px 0;flex-wrap:wrap}
.design .d-head h3{margin:0}
.d-intro{margin:8px 22px 0!important;font-size:14px!important;color:var(--muted)}
.pub-badge{font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;background:color-mix(in srgb,var(--done) 16%,var(--surface));color:var(--done)}
.pub-badge.draft{background:var(--surface-2);color:var(--muted)}
.d-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;padding:18px 22px 22px}
.drop{position:relative;border:2px dashed var(--border);border-radius:14px;background:var(--surface-2);min-height:320px;height:100%;display:grid;place-items:center;text-align:center;overflow:hidden;transition:.15s;padding:18px}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop.has{border-style:solid;padding:0;background:var(--surface)}
.drop input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.drop .ph{display:grid;gap:6px;justify-items:center;color:var(--muted);font-size:13px;pointer-events:none}
.drop .ph svg{width:44px;height:44px;color:var(--accent);margin-bottom:4px}
.drop .ph b{color:var(--text);font-size:15px}
.drop .chg{position:absolute;left:10px;bottom:10px;background:rgba(15,16,23,.78);color:#fff;font-size:12.5px;padding:6px 12px;border-radius:999px;pointer-events:none}
.drop .rm{position:absolute;right:10px;top:10px;z-index:2;width:32px;height:32px;border-radius:50%;border:0;background:rgba(15,16,23,.78);color:#fff;font-size:14px}
.drop .rm:hover{background:#d64545}
.fld{display:grid;gap:6px;margin-bottom:14px}
.fld>label,.fld .lb{font-size:12.5px;font-weight:700;color:var(--muted)}
.fld input[type=text],.fld textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);outline:none;resize:vertical}
.fld input[type=text]:focus,.fld textarea:focus{border-color:var(--accent);background:var(--surface)}
.fld .cnt{font-size:11.5px;color:var(--muted);text-align:right}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--border);background:var(--surface);padding:5px 11px;border-radius:999px;font-size:12.5px;color:var(--muted);transition:.15s}
.opt:hover{border-color:var(--accent);color:var(--text)}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.addrow{display:flex;gap:6px;margin-top:4px}
.addrow input{flex:1;min-width:0}
.addrow .btn{padding:8px 14px}
.mark{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.mark input{width:18px;height:18px;accent-color:var(--done);margin:0}
.pub-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 22px;border-top:1px solid var(--border);background:var(--surface-2)}
.btn-pub{border:1px solid var(--accent);background:var(--accent);color:var(--accent-text);padding:11px 20px;border-radius:12px;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;gap:8px;transition:.15s;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn-pub:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn-pub:active{transform:translateY(0)}
.btn-pub[aria-disabled="true"]{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none;filter:none}
.btn-pub.loading{pointer-events:none;opacity:.85}
.btn-pub.loading:before{content:"";width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.btn-pub.ok{background:var(--done);border-color:var(--done);color:#fff;box-shadow:none}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{font-size:13px;color:var(--muted)}
.hint.err{color:#d64545;font-weight:600}
.confirm{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--done) 14%,var(--surface));border:1px solid var(--done);padding:12px 14px;border-radius:12px;margin:16px 22px 0;font-size:14px}
.pubcard{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;padding:18px 22px 22px}
.pubimg{border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface-2);align-self:start}
.pubimg img{width:100%;display:block;max-height:520px;object-fit:contain}
.pubcard h4{margin:0 0 6px;font-size:20px;line-height:1.25}
.pubcard .pdesc{margin:0 0 14px;font-size:15px;color:var(--text);white-space:pre-wrap}
.meta{margin-bottom:12px}
.meta b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.meta .pill{margin:0 6px 6px 0;display:inline-block}
.btn.danger:hover{border-color:#d64545;color:#d64545}
.gal{margin-bottom:28px}
.gal h3{margin:0 0 12px;font-size:16px}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.gt{border:1px solid var(--border);background:var(--surface);border-radius:14px;overflow:hidden;text-align:left;padding:0;box-shadow:var(--shadow-sm);transition:transform .15s,box-shadow .15s}
.gt:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.gt img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.gt div{padding:8px 10px;font-size:12.5px;line-height:1.35}
.gt div span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:760px){
  .d-body,.pubcard{grid-template-columns:1fr}
  .drop{min-height:240px}
  .pub-row .btn,.pub-row .btn-pub{flex:1 1 auto;justify-content:center}
}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:0 auto 0 0;width:min(92vw,360px);z-index:30;transform:translateX(-102%);transition:transform .25s ease;box-shadow:var(--shadow)}
  .nav-open .sidebar{transform:none}
  .nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(10,10,25,.5);z-index:20}
  .menu-btn{display:grid}
  .topbar{padding:12px 16px}
  .content{padding:16px}
  .weeks{grid-template-columns:repeat(2,1fr)}
  .hero{padding:24px}
  .hero h2,.head h2{font-size:23px}
  .head-b{padding:20px}
  .reset{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Liste des 30 jours">
    <div class="side-head">
      <button class="brand" id="homeBtn" aria-label="Retour à l'accueil">
        <div class="logo">F30</div>
        <div><h1>Challenge Figma 30 jours</h1><small>Fêtes &amp; célébrations du monde</small></div>
      </button>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Rechercher une fête, un livrable…" autocomplete="off" aria-label="Rechercher">
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filtrer par catégorie"></div>
      <div class="status-row">
        <label for="statusFilter">Statut</label>
        <select id="statusFilter">
          <option value="all">Tous les statuts</option>
          <option value="todo">À faire</option>
          <option value="doing">En cours</option>
          <option value="done">Terminé</option>
        </select>
      </div>
    </div>
    <nav class="list" id="list"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Ouvrir la liste des jours">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="prog" aria-live="polite">
        <div class="prog-top"><strong id="progText"></strong><span id="progSub"></span></div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="30" id="bar"><i class="b-done" id="bDone"></i><i class="b-doing" id="bDoing"></i></div>
      </div>
      <button class="reset" id="resetBtn">Réinitialiser</button>
    </header>
    <main class="content" id="content"><div class="wrap" id="view"></div></main>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============================================================
   DONNÉES — 30 briefs du challenge
   ============================================================ */
const CATS = [
  {id:"all", label:"Toutes les fêtes"},
  {id:"mobile", label:"UI Mobile"},
  {id:"web", label:"Landing & Web"},
  {id:"comp", label:"Composants & Systèmes"},
  {id:"social", label:"Social & Print"},
  {id:"dash", label:"Dashboards"},
  {id:"proto", label:"Prototype & Animation"}
];
const CAT_LABEL = Object.fromEntries(CATS.map(c => [c.id, c.label]));

const WEEKS = [
  {n:1, label:"Semaine 1 · Fondations", range:[1,7]},
  {n:2, label:"Semaine 2 · Composants", range:[8,14]},
  {n:3, label:"Semaine 3 · Flux & systèmes", range:[15,22]},
  {n:4, label:"Semaine 4 · Variables & finale", range:[23,30]}
];

const DAYS = [

/* ============================================================
   ÉTAT & PERSISTENCE
   ============================================================ */
const STORE_KEY = "figma30.progress.v1";
const STATUS = {todo:"À faire", doing:"En cours", done:"Terminé"};
const TOTAL = DAYS.length;
let progress = {};
try { progress = JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch (e) { progress = {}; }
const filters = {cat:"all", status:"all", q:""};

function saveProgress(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) {} }
function getStatus(id){ return progress[id] || "todo"; }
function setStatus(id, s){
  if (s === "todo") delete progress[id]; else progress[id] = s;
  saveProgress();
  refresh();
}
function counts(){
  let done = 0, doing = 0;
  for (const d of DAYS){ const s = getStatus(d.id); if (s === "done") done++; else if (s === "doing") doing++; }
  return {done, doing};
}

/* ============================================================
   UTILITAIRES
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const pad = n => String(n).padStart(2, "0");
const dayById = id => DAYS.find(d => d.id === id);

function matches(d){
  if (filters.cat !== "all" && d.cat !== filters.cat) return false;
  if (filters.status !== "all" && getStatus(d.id) !== filters.status) return false;
  if (filters.q){
    const hay = norm([d.id, "jour " + d.id, d.fete, d.livrable, CAT_LABEL[d.cat], d.contexte, d.objectif, d.livrables, d.contraintes, d.style].join(" "));
    return filters.q.split(/\s+/).every(t => hay.includes(t));
  }
  return true;
}
function strip(colors){ return '<div class="strip">' + (colors || []).map(c => '<i style="background:' + esc(c) + '"></i>').join("") + '</div>'; }

let toastTimer;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}
function copyText(text, okMsg){
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove();
    toast(ok ? okMsg : "Copie impossible : sélectionne le texte manuellement.");
  };
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(() => toast(okMsg), fallback);
  } else fallback();
}
function briefText(d){
  return "Jour " + d.id + " : " + d.fete + " — " + d.livrable + "\n\n" +
    "Contexte & Client : " + d.contexte + "\n\n" +
    "Objectif du design : " + d.objectif + "\n\n" +
    "Livrables attendus : " + d.livrables + "\n\n" +
    "Contraintes techniques & Figma : " + d.contraintes + "\n\n" +
    "Consignes de style : " + d.style;
}

/* ============================================================
   RENDU
   ============================================================ */
function renderChips(){
  $("#chips").innerHTML = CATS.map(c =>
    '<button class="chip" data-cat="' + c.id + '" aria-pressed="' + (filters.cat === c.id) + '">' + esc(c.label) + '</button>').join("");
}

function renderList(){
  const list = DAYS.filter(matches);
  const cur = currentId();
  let html = '<div class="count">' + list.length + " jour" + (list.length > 1 ? "s" : "") + " affiché" + (list.length > 1 ? "s" : "") + "</div>";
  if (!list.length){
    html += '<div class="empty">Aucun jour ne correspond à ta recherche.<br><br><button class="btn" data-clear>Effacer les filtres</button></div>';
  } else {
    html += list.map(d => {
      const s = getStatus(d.id);
      return '<button class="item' + (d.id === cur ? " active" : "") + '" data-open="' + d.id + '">' +
        '<span class="num">' + pad(d.id) + '</span>' +
        '<span class="txt"><div class="t">' + esc(d.fete) + '</div><div class="s">' + esc(d.livrable) + '</div></span>' +
        '<span class="dot ' + s + '" title="' + STATUS[s] + '" aria-label="' + STATUS[s] + '"></span></button>';
    }).join("");
  }
  $("#list").innerHTML = html;
}

function renderProgress(){
  const {done, doing} = counts();
  const pct = Math.round(done / TOTAL * 100);
  $("#progText").textContent = done + "/" + TOTAL + " jours complétés - " + pct + "%";
  $("#progSub").textContent = doing ? doing + " en cours" : (done === TOTAL ? "Challenge terminé, bravo !" : "Prêt à démarrer ?");
  $("#bDone").style.width = (done / TOTAL * 100) + "%";
  $("#bDoing").style.width = (doing / TOTAL * 100) + "%";
  const bar = $("#bar");
  bar.setAttribute("aria-valuenow", done);
  bar.setAttribute("aria-label", pct + " % du challenge complété");
}

function currentId(){
  const m = location.hash.match(/^#\/jour\/(\d+)$/);
  const id = m ? parseInt(m[1], 10) : 0;
  return dayById(id) ? id : 0;
}

function renderHome(){
  const {done, doing} = counts();
  const next = DAYS.find(d => getStatus(d.id) !== "done");
  const list = DAYS.filter(matches);
  const weeks = WEEKS.map(w => {
    const ds = DAYS.filter(d => d.id >= w.range[0] && d.id <= w.range[1]);
    const dn = ds.filter(d => getStatus(d.id) === "done").length;
    return '<div class="week"><b>' + esc(w.label) + '</b><span>Jours ' + w.range[0] + " à " + w.range[1] + " · " + dn + "/" + ds.length +
      '</span><div class="wb"><i style="width:' + (dn / ds.length * 100) + '%"></i></div></div>';
  }).join("");
  const cards = list.map(d => {
    const s = getStatus(d.id);
    return '<button class="card" data-open="' + d.id + '">' + strip(d.colors) +
      '<div class="card-b"><div class="top"><span class="d">Jour ' + d.id + '</span><span class="badge"><span class="dot ' + s + '"></span>' + STATUS[s] + '</span></div>' +
      '<h3>' + esc(d.fete) + '</h3><p>' + esc(d.livrable) + '</p>' +
      '<div class="foot"><span class="tag">' + esc(CAT_LABEL[d.cat]) + '</span></div></div></button>';
  }).join("");
  $("#view").innerHTML =
    '<section class="hero"><h2>30 jours, 30 fêtes, 30 briefs clients</h2>' +
    '<p>Un programme de design d\'interfaces et de création graphique dans Figma, des bases d\'Auto Layout jusqu\'aux Variables et aux prototypes avancés. ' +
    (done ? "Tu as déjà terminé " + done + " jour" + (done > 1 ? "s" : "") + "." : "Choisis un jour pour commencer.") + '</p>' +
    (next ? '<button class="cta" data-open="' + next.id + '">' + (done || doing ? "Reprendre au Jour " : "Commencer au Jour ") + next.id + ' →</button>' : '') +
    '</section><div class="weeks">' + weeks + '</div>' + galleryHtml() +
    '<div class="grid">' + (cards || '<div class="empty" style="grid-column:1/-1">Aucun jour ne correspond à ta recherche.</div>') + '</div>';
}

function renderDetail(d){
  const s = getStatus(d.id);
  const prev = dayById(d.id - 1), nextD = dayById(d.id + 1);
  const sec = (icon, title, body) =>
    '<section class="sec"><h3><span class="i">' + icon + '</span>' + title + '</h3><p>' + esc(body) + '</p></section>';
  $("#view").innerHTML =
    '<div class="crumbs"><button data-home>Accueil</button><span>›</span><span>' + esc(WEEKS.find(w => w.n === d.week).label) + '</span><span>›</span><span>Jour ' + d.id + '</span></div>' +
    '<article class="head">' + strip(d.colors) + '<div class="head-b">' +
      '<div class="eyebrow"><span class="pill">Jour ' + d.id + ' / ' + TOTAL + '</span><span class="pill alt">' + esc(CAT_LABEL[d.cat]) + '</span></div>' +
      '<h2>' + esc(d.fete) + '</h2><p class="sub">' + esc(d.livrable) + '</p>' +
      '<div class="actions">' +
        '<label class="check' + (s === "done" ? " on" : "") + '"><input type="checkbox" id="doneBox"' + (s === "done" ? " checked" : "") + '> Complété</label>' +
        '<select class="sel" id="statusSel" aria-label="Statut du jour">' +
          Object.keys(STATUS).map(k => '<option value="' + k + '"' + (k === s ? " selected" : "") + '>' + STATUS[k] + '</option>').join("") + '</select>' +
        '<button class="btn primary" id="copyBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>Copier le brief</button>' +
      '</div></div></article>' +
    '<div class="sections">' +
      sec("🏢", "Contexte &amp; Client", d.contexte) +
      sec("🎯", "Objectif du design", d.objectif) +
      sec("📦", "Livrables attendus", d.livrables) +
      sec("🧩", "Contraintes techniques &amp; Figma", d.contraintes) +
      '<section class="sec"><h3><span class="i">🎨</span>Consignes de style</h3><p>' + esc(d.style) + '</p>' +
        '<div class="sw">' + d.colors.map(c => '<button data-color="' + esc(c) + '" title="Copier ' + esc(c) + '"><i style="background:' + esc(c) + '"></i>' + esc(c) + '</button>').join("") + '</div></section>' +
    '</div>' +
    designSection(d) +
    '<div class="pager">' +
      (prev ? '<button class="btn" data-open="' + prev.id + '">← Jour ' + prev.id + '</button>' : '<span></span>') +
      (nextD ? '<button class="btn" data-open="' + nextD.id + '">Jour ' + nextD.id + ' →</button>' : '<span></span>') +
    '</div>';
}

function renderView(){
  const id = currentId();
  if (id) renderDetail(dayById(id)); else renderHome();
  $("#content").scrollTop = 0;
}
/* Mise à jour sans perdre le défilement ni le focus de la recherche */
function refresh(){
  renderProgress(); renderList();
  const id = currentId();
  if (id){
    const s = getStatus(id);
    const box = $("#doneBox"), sel = $("#statusSel");
    if (box){ box.checked = s === "done"; box.closest(".check").classList.toggle("on", s === "done"); }
    if (sel) sel.value = s;
  } else {
    const y = $("#content").scrollTop;
    renderHome(); $("#content").scrollTop = y;
  }
}

/* ============================================================
   ÉVÉNEMENTS
   ============================================================ */
function go(id){ location.hash = id ? "#/jour/" + id : "#/"; }
function closeNav(){ document.body.classList.remove("nav-open"); }

document.addEventListener("click", e => {
  const t = e.target;
  const open = t.closest("[data-open]");
  if (open){ go(parseInt(open.dataset.open, 10)); closeNav(); return; }
  if (t.closest("[data-home]") || t.closest("#homeBtn")){ go(0); closeNav(); return; }
  const chip = t.closest(".chip");
  if (chip){ filters.cat = chip.dataset.cat; renderChips(); renderList(); if (!currentId()) refresh(); return; }
  if (t.closest("[data-clear]")){
    filters.cat = "all"; filters.status = "all"; filters.q = "";
    $("#q").value = ""; $("#statusFilter").value = "all";
    renderChips(); refresh(); return;
  }
  const col = t.closest("[data-color]");
  if (col){ copyText(col.dataset.color, "Couleur " + col.dataset.color + " copiée"); return; }
  if (t.closest("#copyBtn")){
    const d = dayById(currentId());
    if (d) copyText(briefText(d), "Brief du Jour " + d.id + " copié dans le presse-papier");
    return;
  }
  if (t.closest("#menuBtn")){ document.body.classList.toggle("nav-open"); return; }
  if (t.closest("#scrim")){ closeNav(); return; }
  if (t.closest("#resetBtn")){
    if (confirm("Réinitialiser toute ta progression ?")){ progress = {}; saveProgress(); refresh(); toast("Progression réinitialisée"); }
  }
});

document.addEventListener("change", e => {
  const id = currentId();
  if (e.target.id === "doneBox" && id) setStatus(id, e.target.checked ? "done" : "todo");
  else if (e.target.id === "statusSel" && id) setStatus(id, e.target.value);
  else if (e.target.id === "statusFilter"){ filters.status = e.target.value; refresh(); }
});

$("#q").addEventListener("input", e => {
  filters.q = norm(e.target.value.trim());
  renderList();
  if (!currentId()) { const y = $("#content").scrollTop; renderHome(); $("#content").scrollTop = y; }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeNav();
  if (e.target.matches("input, select, textarea")) return;
  const id = currentId();
  if (!id) return;
  if (e.key === "ArrowRight" && dayById(id + 1)) go(id + 1);
  if (e.key === "ArrowLeft" && dayById(id - 1)) go(id - 1);
});

window.addEventListener("hashchange", () => { renderView(); renderList(); });

/* Synchronisation entre onglets */
window.addEventListener("storage", e => {
  if (e.key === STORE_KEY){
    try { progress = JSON.parse(e.newValue || "{}") || {}; } catch (err) { progress = {}; }
    refresh();
  }
});

   DESIGN DU JOUR — publication
   ============================================================ */
const DESIGN_KEY = "figma30.designs.v1";

try { designs = JSON.parse(localStorage.getItem(DESIGN_KEY) || "{}") || {}; } catch (e) { designs = {}; }
const TOOL_SUGGEST = ["Figma", "FigJam", "Illustrator", "Photoshop", "Procreate", "Blender", "After Effects", "Spline"];
const TAG_SUGGEST = ["Auto Layout", "Variants", "Prototype", "Variables", "Mobile", "Landing page", "Dark mode", "Animation", "Illustration", "Typographie"];
const MAX_ITEMS = 10;
let draft = null, editId = 0, confirmId = 0, publishing = false;

function saveDesigns(){
  try { localStorage.setItem(DESIGN_KEY, JSON.stringify(designs)); return true; } catch (e) { return false; }
}
function getDraft(id){
  if (!draft || draft.id !== id){
    const s = designs[id];
    draft = s
      ? {id, image:s.image, title:s.title, desc:s.desc, tools:s.tools.slice(), tags:s.tags.slice(), markDone:false}
      : {id, image:"", title:"", desc:"", tools:["Figma"], tags:[], markDone:getStatus(id) !== "done"};
  }
  return draft;
}
function slug(s){ return norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "design"; }
function missing(dr){
  const m = [];
  if (!dr.image) m.push("une image");
  if (dr.title.trim().length < 3) m.push("un titre (3 caractères min.)");
  return m;
}
function hintText(dr){
  const m = missing(dr);
  return m.length ? "Il manque : " + m.join(" et ") + "." : "Tout est prêt : ton design sera enregistré dans ta galerie.";
}
function shareText(id){
  const d = dayById(id), s = designs[id];
  return "Design du Jour " + id + " — " + d.fete + " : " + s.title + "\n" +
    (s.desc ? s.desc + "\n" : "") +
    "Outils : " + (s.tools.join(", ") || "—") +
    (s.tags.length ? "\n" + s.tags.map(t => "#" + t.replace(/[^\p{L}\p{N}]+/gu, "")).join(" ") : "") +
    "\n#Figma30Jours";
}
function optsHtml(kind, suggest, selected){
  const all = suggest.concat(selected.filter(v => !suggest.includes(v)));
  return all.map(v => '<button type="button" class="opt" data-d-toggle="' + kind + '" data-v="' + esc(v) + '" aria-pressed="' + selected.includes(v) + '">' + esc(v) + '</button>').join("");
}

    '<div class="pub-row">' +
      '<button type="button" class="btn-pub" id="dPublish" aria-disabled="' + (!ok) + '">' + (s ? "Mettre à jour le design" : "Publier le design") + ' →</button>' +
      (s ? '<button type="button" class="btn" data-d-act="cancel">Annuler</button>' : '') +
      '<span class="hint" id="dHint" role="status">' + esc(hintText(dr)) + '</span>' +
    '</div>';
}
function designSection(d){
  return '<section class="sec design" id="designBox" data-day="' + d.id + '">' + designInner(d.id) + '</section>';
}
function renderDesign(id){
  const b = $("#designBox");
  if (b && parseInt(b.dataset.day, 10) === id) b.innerHTML = designInner(id);
}
function syncPublish(id){
  const dr = getDraft(id), btn = $("#dPublish"), hint = $("#dHint");
  if (btn) btn.setAttribute("aria-disabled", String(!!missing(dr).length));
  if (hint){ hint.textContent = hintText(dr); hint.classList.remove("err"); }
}
function galleryHtml(){
  const items = DAYS.filter(d => designs[d.id]);
  if (!items.length) return "";
  return '<section class="gal"><h3>Ma galerie · ' + items.length + " design" + (items.length > 1 ? "s" : "") + " publié" + (items.length > 1 ? "s" : "") + '</h3><div class="gal-grid">' +
    items.map(d => '<button class="gt" data-open="' + d.id + '"><img src="' + esc(designs[d.id].image) + '" alt="' + esc(designs[d.id].title) + '"><div><b>Jour ' + d.id + '</b><span>' + esc(designs[d.id].title) + '</span></div></button>').join("") +
    '</div></section>';
}

function loadImage(file, id){
  if (!file || !/^image\//.test(file.type)){ toast("Choisis un fichier image (PNG, JPG, WebP…)"); return; }
  if (file.size > 20 * 1024 * 1024){ toast("Image trop lourde (20 Mo maximum)."); return; }
  const fr = new FileReader();
  fr.onerror = () => toast("Impossible de lire ce fichier.");
  fr.onload = () => {
    const img = new Image();
    img.onerror = () => toast("Image illisible ou format non pris en charge.");
    img.onload = () => {
      const k = Math.min(1, 1400 / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const x = c.getContext("2d");
      x.fillStyle = "#ffffff"; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
      getDraft(id).image = c.toDataURL("image/jpeg", 0.85);
      renderDesign(id);
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

function addCustom(id, kind){
  const sel = kind === "tool" ? "#dToolNew" : "#dTagNew";
  const inp = $(sel); if (!inp) return;
  const raw = inp.value.trim().replace(/^#/, "");
  if (!raw) return;
  const dr = getDraft(id), list = kind === "tool" ? dr.tools : dr.tags, sug = kind === "tool" ? TOOL_SUGGEST : TAG_SUGGEST;
  const found = sug.concat(list).find(v => v.toLowerCase() === raw.toLowerCase());
  const v = found || raw;
  if (!list.includes(v)){
    if (list.length >= MAX_ITEMS){ toast("Maximum " + MAX_ITEMS + " éléments."); return; }
    list.push(v);
  }
  renderDesign(id);
  const n = $(sel); if (n) n.focus();
}

function publish(id){
  if (publishing) return;
  const dr = getDraft(id), btn = $("#dPublish"), hint = $("#dHint");
  const m = missing(dr);
  if (m.length){
    if (hint){ hint.textContent = "Il manque : " + m.join(" et ") + "."; hint.classList.add("err"); }
    if (!dr.image){ const f = $("#drop"); if (f) f.scrollIntoView({behavior:"smooth", block:"center"}); }
    else { const t = $("#dTitle"); if (t) t.focus(); }
    return;
  }
  publishing = true;
  btn.classList.add("loading"); btn.textContent = "Publication…";
  setTimeout(() => {
    const previous = designs[id];
    designs[id] = {title:dr.title.trim(), desc:dr.desc.trim(), tools:dr.tools.slice(), tags:dr.tags.slice(), image:dr.image, at:Date.now()};
    if (!saveDesigns()){
      if (previous) designs[id] = previous; else delete designs[id];
      publishing = false;
      toast("Stockage plein : retire un ancien design ou choisis une image plus légère.");
      renderDesign(id); return;
    }
    const mark = dr.markDone;
    btn.classList.remove("loading"); btn.classList.add("ok"); btn.textContent = "✓ Publié !";
    toast("Design du Jour " + id + " publié");
    setTimeout(() => {
      publishing = false; editId = 0; confirmId = id; draft = null;
      if (mark) setStatus(id, "done");
      renderDesign(id);
    }, 700);
  }, 600);
}

function shareDesign(id){
  const s = designs[id], text = shareText(id);
  if (navigator.share){
    navigator.share({title:s.title, text}).catch(err => { if (!err || err.name !== "AbortError") copyText(text, "Texte de partage copié"); });
  } else copyText(text, "Texte de partage copié dans le presse-papier");
}

document.addEventListener("click", e => {
  const t = e.target, box = t.closest("#designBox");
  if (!box) return;
  const id = parseInt(box.dataset.day, 10);
  const tg = t.closest("[data-d-toggle]");
  if (tg){
    const dr = getDraft(id), list = tg.dataset.dToggle === "tool" ? dr.tools : dr.tags, v = tg.dataset.v, i = list.indexOf(v);
    if (i > -1) list.splice(i, 1); else if (list.length < MAX_ITEMS) list.push(v); else toast("Maximum " + MAX_ITEMS + " éléments.");
    renderDesign(id); return;
  }
  const add = t.closest("[data-d-add]");
  if (add){ addCustom(id, add.dataset.dAdd); return; }
  if (t.closest("#dPublish")){ publish(id); return; }
  const act = t.closest("[data-d-act]");
  if (!act) return;
  switch (act.dataset.dAct){
    case "rmimg": getDraft(id).image = ""; renderDesign(id); break;
    case "share": shareDesign(id); break;
    case "dl": {
      const s = designs[id], a = document.createElement("a");
      a.href = s.image; a.download = "jour-" + pad(id) + "-" + slug(s.title) + ".jpg";
      document.body.appendChild(a); a.click(); a.remove(); break;
    }
    case "edit": editId = id; confirmId = 0; draft = null; renderDesign(id); break;
    case "cancel": editId = 0; draft = null; renderDesign(id); break;
    case "unpublish":
      if (confirm("Retirer ce design de ta galerie ?")){
        delete designs[id]; saveDesigns(); editId = 0; confirmId = 0; draft = null;
        renderDesign(id); toast("Design retiré de la galerie");
      }
      break;
  }
});

document.addEventListener("input", e => {
  const box = e.target.closest && e.target.closest("#designBox");
  if (!box) return;
  const id = parseInt(box.dataset.day, 10), dr = getDraft(id);
  if (e.target.id === "dTitle"){ dr.title = e.target.value; syncPublish(id); }
  else if (e.target.id === "dDesc"){ dr.desc = e.target.value; const c = $("#dCount"); if (c) c.textContent = dr.desc.length + " / 280"; }
});

document.addEventListener("change", e => {
  const box = e.target.closest && e.target.closest("#designBox");
  if (!box) return;
  const id = parseInt(box.dataset.day, 10);
  if (e.target.id === "dFile"){ loadImage(e.target.files && e.target.files[0], id); e.target.value = ""; }
  else if (e.target.id === "dMarkDone") getDraft(id).markDone = e.target.checked;
});

document.addEventListener("keydown", e => {
  const tid = e.target.id;
  if (tid !== "dToolNew" && tid !== "dTagNew") return;
  if (e.key === "Enter" || (e.key === "," && tid === "dTagNew")){
    e.preventDefault();
    const box = e.target.closest("#designBox");
    if (box) addCustom(parseInt(box.dataset.day, 10), tid === "dToolNew" ? "tool" : "tag");
  }
});

["dragenter", "dragover"].forEach(ev => document.addEventListener(ev, e => {
  const z = e.target.closest && e.target.closest("#drop");
  if (z){ e.preventDefault(); z.classList.add("over"); }
}));
document.addEventListener("dragleave", e => {
  const z = e.target.closest && e.target.closest("#drop");
  if (z) z.classList.remove("over");
});
document.addEventListener("drop", e => {
  const z = e.target.closest && e.target.closest("#drop");
  if (!z) return;
  e.preventDefault(); z.classList.remove("over");
  const box = $("#designBox");
  if (box) loadImage(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0], parseInt(box.dataset.day, 10));
});
document.addEventListener("paste", e => {
  const box = $("#designBox");
  if (!box || !$("#drop")) return;
  const files = Array.from((e.clipboardData && e.clipboardData.files) || []);
  const f = files.find(x => /^image\//.test(x.type));
  if (f){ e.preventDefault(); loadImage(f, parseInt(box.dataset.day, 10)); }
});
window.addEventListener("hashchange", () => { confirmId = 0; editId = 0; });

/* ============================================================
   DÉMARRAGE
   ============================================================ */
renderChips();
renderProgress();
renderList();
renderView();
</script>
</body>
</html>
